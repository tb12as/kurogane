name: release
on:
  push: {tags: ["v*"]}

permissions:
  contents: write
  id-token: write   # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: "1.27.x", check-latest: true}
      # embeds the committed web/.output/public (checked by the ci web job); nuxt output carries a random
      # build id, so rebuilding here would mark the tree dirty and the version as "-dirty"
      - name: reproducible binaries + checksums
        run: make dist
      - name: verify reproducibility
        run: |
          cp dist/serverkeeper-linux-amd64 /tmp/a && make dist && cmp /tmp/a dist/serverkeeper-linux-amd64
      - name: deb/rpm packages
        run: make packages
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with: {path: ., format: spdx-json, output-file: dist/serverkeeper.spdx.json}
      - uses: sigstore/cosign-installer@v3
      - name: sign artifacts (cosign keyless)
        run: |
          for f in dist/serverkeeper-linux-* dist/*.deb dist/*.rpm dist/checksums.txt; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
      - name: minisign (optional)
        if: ${{ env.MINISIGN_KEY != '' }}
        env: {MINISIGN_KEY: "${{ secrets.MINISIGN_KEY }}"}
        run: |
          go install aead.dev/minisign/cmd/minisign@latest
          echo "$MINISIGN_KEY" > /tmp/minisign.key
          for f in dist/serverkeeper-linux-*; do ~/go/bin/minisign -S -s /tmp/minisign.key -m "$f"; done
      - name: offline bundles
        run: |
          for a in amd64 arm64; do deploy/bundle.sh $a v1.110.0; done
      - name: publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cp deploy/serverkeeper.service deploy/serverkeeper-server.service deploy/install.sh dist/
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  docker:
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ghcr.io/tb12as/serverkeeper-server:${{ github.ref_name }}
