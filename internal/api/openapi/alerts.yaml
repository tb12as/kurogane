paths:
  /alerts/metrics:
    get:
      summary: Metrics a rule can use, with description, source, unit, labels, preset thresholds and current values
      responses: {"200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/MetricDef"}}}}}}
  /alerts/rules:
    get:
      summary: List alert rules (built-in and custom)
      responses: {"200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AlertRule"}}}}}}
    post:
      summary: Create a rule (admin)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AlertRuleInput"}}}}
      responses: {"200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/AlertRule"}}}}}
  /alerts/rules/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    put:
      summary: Edit a rule; only fields given change (admin)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AlertRuleInput"}}}}
      responses: {"200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/AlertRule"}}}}}
    delete:
      summary: Delete a custom rule (built-ins can only be disabled) (admin)
      responses: {"200": {description: ok}}
  /alerts/events:
    get:
      summary: Alert history
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [open, firing, acknowledged, resolved]}}
        - {name: rule, in: query, schema: {type: string}}
        - {name: server, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string}, description: "duration, e.g. 7d"}
        - name: from
          in: query
          schema: {type: string}
          description: RFC3339 or YYYY-MM-DD (local midnight); overrides since
        - name: to
          in: query
          schema: {type: string}
          description: Exclusive RFC3339 or inclusive YYYY-MM-DD (local date)
        - {name: limit, in: query, schema: {type: integer}}
      responses: {"200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AlertEvent"}}}}}, "400": {description: Invalid period}}
  /alerts/events/export:
    get:
      summary: Export alert history (AL-7)
      parameters:
        - {name: format, in: query, schema: {type: string, enum: [csv, json]}}
        - {name: since, in: query, schema: {type: string}, description: "Positive duration, e.g. 7d"}
        - name: from
          in: query
          schema: {type: string}
          description: RFC3339 or YYYY-MM-DD (local midnight); overrides since
        - name: to
          in: query
          schema: {type: string}
          description: Exclusive RFC3339 or inclusive YYYY-MM-DD (local date)
      responses: {"200": {description: file, content: {text/csv: {schema: {type: string}}, application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AlertEvent"}}}}}, "400": {description: Invalid period}}
  /alerts/events/summary:
    get:
      summary: Summarize events (read); defaults to local midnight until now, at most 100000 events
      parameters:
        - {name: format, in: query, schema: {type: string, enum: [json, csv]}}
        - {name: since, in: query, schema: {type: string}, description: "Positive duration, e.g. 7d"}
        - name: from
          in: query
          schema: {type: string}
          description: RFC3339 or YYYY-MM-DD (local midnight); overrides since
        - name: to
          in: query
          schema: {type: string}
          description: Exclusive RFC3339 or inclusive YYYY-MM-DD (local date)
        - {name: state, in: query, schema: {type: string}}
        - {name: rule, in: query, schema: {type: string}}
        - {name: server, in: query, schema: {type: string}}
      responses:
        "200":
          description: Summary or CSV attachment (dimension,key,count)
          content:
            application/json: {schema: {$ref: "#/components/schemas/Summary"}}
            text/csv: {schema: {type: string}}
        "400": {description: Invalid period; use RFC3339 or YYYY-MM-DD with from before to}
  /alerts/events/summary/send:
    post:
      summary: Send a summary to a configured chat, email or webhook channel (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: {type: string}
                from: {type: string, description: "RFC3339 or YYYY-MM-DD (local midnight); overrides since"}
                to: {type: string, description: "Exclusive RFC3339 or inclusive YYYY-MM-DD (local date)"}
                since: {type: string, description: "Positive duration, e.g. 7d; defaults to today without a period"}
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, total]
                properties: {ok: {type: boolean}, total: {type: integer}}
        "400": {description: Invalid period, unknown or misconfigured channel, or PagerDuty channel}
        "502": {description: Delivery failed; check the channel and retry}
  /alerts/events/{id}/ack:
    post:
      summary: Acknowledge (stops reminders) (admin)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/AlertEvent"}}}}}
  /alerts/events/{id}/noise:
    post:
      summary: Mark as noise / false positive (admin)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {noise: {type: boolean}}}}}}
      responses: {"200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/AlertEvent"}}}}}
  /alerts/silences:
    get:
      summary: List silences
      parameters: [{name: active, in: query, schema: {type: boolean}}]
      responses: {"200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Silence"}}}}}}
    post:
      summary: Create a silence / maintenance window (admin)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {server: {type: string}, rule: {type: string}, tag: {type: string}, for: {type: string}, starts_at: {type: string, format: date-time}, ends_at: {type: string, format: date-time}, reason: {type: string}}}}}
      responses: {"200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Silence"}}}}}
  /alerts/silences/{id}:
    delete:
      summary: Delete a silence (admin)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: ok}}
  /alerts/channels:
    get:
      summary: List channels (secrets are never returned)
      responses: {"200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ChannelInfo"}}}}}}
    post:
      summary: Add a channel; webhook_url is encrypted at rest (admin)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, type], properties: {name: {type: string}, type: {type: string, enum: [slack, discord, telegram, email, pagerduty, webhook]}, webhook_url: {type: string}, webhook_url_env: {type: string}, chat_id: {type: string}, to: {type: array, items: {type: string}}, smtp_addr: {type: string}, smtp_user: {type: string}, from: {type: string}}}}}
      responses: {"200": {description: ok}}
  /alerts/channels/{name}:
    delete:
      summary: Delete an API-managed channel (admin)
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: ok}}
  /alerts/channels/{name}/test:
    post:
      summary: Send a test message (admin)
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: ok}, "502": {description: delivery failed}}
components:
  schemas:
    AlertRule:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        expr: {type: string}
        for: {type: integer, description: nanoseconds}
        severity: {type: string}
        channels: {type: array, items: {type: string}}
        enabled: {type: boolean}
        tags: {type: array, items: {type: string}}
        builtin: {type: boolean}
        conditions:
          description: "expr as comparisons joined by one operator; null when it mixes and/or (read-only)"
          nullable: true
          type: object
          properties:
            join: {type: string, enum: [and, or]}
            items: {type: array, items: {$ref: "#/components/schemas/RuleCondition"}}
        summary: {type: string, description: "expr in words, e.g. CPU usage, all cores above 90 % (read-only)"}
    RuleCondition:
      type: object
      required: [metric, op, value]
      properties:
        metric: {type: string}
        labels: {type: object, additionalProperties: {type: string}}
        op: {type: string, enum: [">", ">=", "<", "<=", "==", "!="]}
        value: {type: number}
    MetricDef:
      type: object
      required: [name, group, title, description, unit, presets, default_op, live]
      properties:
        name: {type: string}
        group: {type: string}
        title: {type: string}
        description: {type: string, description: what it measures and where it comes from}
        unit: {type: string, enum: [pct, bytes, bytes_ps, count, per_s, ms, s, h, days, ratio, bool]}
        labels: {type: array, items: {type: string}}
        presets: {type: array, items: {type: number}}
        min: {type: number}
        max: {type: number}
        states: {type: object, additionalProperties: {type: string}, description: 'bool metrics: words for "1" and "0"'}
        default_op: {type: string}
        computed: {type: boolean, description: derived by the alert engine; no history}
        live: {type: array, items: {type: object, properties: {labels: {type: object, additionalProperties: {type: string}}, value: {type: number}}}, description: current values on this agent (empty on the central server)}
    AlertRuleInput:
      type: object
      properties: {id: {type: string}, name: {type: string}, expr: {type: string}, for: {type: string, description: "duration, e.g. 5m"}, severity: {type: string, enum: [info, warning, critical]}, channels: {type: array, items: {type: string}}, enabled: {type: boolean}, tags: {type: array, items: {type: string}}}
    AlertEvent:
      type: object
      properties: {id: {type: string}, rule_id: {type: string}, server_id: {type: string}, fingerprint: {type: string}, state: {type: string, enum: [firing, acknowledged, resolved]}, severity: {type: string}, summary: {type: string}, started_at: {type: string, format: date-time}, acked_at: {type: string, format: date-time}, acked_by: {type: string}, resolved_at: {type: string, format: date-time}, last_sent_at: {type: string, format: date-time}, noise: {type: boolean}, payload: {type: object}}
    Summary:
      type: object
      required: [from, to, total, open, noise, by_severity, by_state, by_rule, by_server]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        total: {type: integer}
        open: {type: integer, description: Events whose current state is not resolved}
        noise: {type: integer}
        by_severity: {type: object, additionalProperties: {type: integer}}
        by_state: {type: object, additionalProperties: {type: integer}}
        by_rule: {type: array, items: {$ref: "#/components/schemas/SummaryCount"}}
        by_server: {type: array, items: {$ref: "#/components/schemas/SummaryCount"}}
    SummaryCount:
      type: object
      required: [key, count]
      properties: {key: {type: string}, count: {type: integer}}
    Silence:
      type: object
      properties: {id: {type: string}, matcher: {type: object, properties: {server: {type: string}, rule: {type: string}, tag: {type: string}}}, starts_at: {type: string, format: date-time}, ends_at: {type: string, format: date-time}, created_by: {type: string}, reason: {type: string}}
    ChannelInfo:
      type: object
      properties: {name: {type: string}, type: {type: string}, has_secret: {type: boolean}, webhook_url_env: {type: string}, source: {type: string, enum: [config, api]}, ready: {type: boolean}}
