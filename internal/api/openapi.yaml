                    type: string
                - in: query
                  name: actor
                  schema:
                    type: string
                - description: prefix match
                  in: query
                  name: action
                  schema:
                    type: string
                - in: query
                  name: limit
                  schema:
                    type: integer
                - in: query
                  name: offset
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AuditEntry'
                                type: array
                    description: ok
            summary: Audit log of every change
    /auth/login:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginResponse'
                    description: logged in
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: bad credentials
                "423":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: locked after 5 failures
            security: []
            summary: Log in with password and mandatory TOTP; sets sk_session and sk_csrf cookies
    /auth/logout:
        post:
            responses:
                "200":
                    description: ok
            summary: Log out
    /auth/me:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Me'
                    description: ok
            summary: Current principal
    /auth/oidc/callback:
        get:
            responses:
                "302":
                    description: redirect to /
            security: []
            summary: OIDC callback
    /auth/oidc/login:
        get:
            responses:
                "302":
                    description: redirect
            security: []
            summary: Redirect to the OIDC provider
    /backup:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                dest:
                                    description: default server.backup.dest
                                    type: string
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    manifest:
                                        $ref: '#/components/schemas/BackupManifest'
                                    path:
                                        type: string
                                type: object
                    description: written
            summary: Back up SQLite, the agent store and (central) a VictoriaMetrics snapshot (admin)
    /fleet/enrollment-tokens:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                name:
                                    description: bind to this server name
                                    type: string
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    expires_at:
                                        format: date-time
                                        type: string
                                    name:
                                        type: string
                                    token:
                                        type: string
                                type: object
                    description: token shown once; format "<secret>.<sha256 of the central CA>"
            summary: Create a one-time agent enrollment token valid for 1 h (admin)
    /fleet/groups:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties:
                                    items:
                                        type: string
                                    type: array
                                type: object
                    description: ok
            summary: Groups and their member names
    /fleet/keys/push:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                group:
                                    type: string
                                person:
                                    type: string
                                tag:
                                    type: string
                                user:
                                    description: login user; default each key's login_user
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    ops:
                                        items:
                                            $ref: '#/components/schemas/FleetOp'
                                        type: array
                                    people:
                                        type: integer
                                    servers:
                                        type: integer
                                type: object
                    description: queued
            summary: Queue AddKey on every server (or servers with tag) for a person's or group's keys (admin)
    /fleet/keys/revoke:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                fingerprint:
                                    type: string
                            required:
                                - fingerprint
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    ops:
                                        items:
                                            $ref: '#/components/schemas/FleetOp'
                                        type: array
                                    servers:
                                        type: integer
                                type: object
                    description: queued
            summary: Remove a fingerprint from every server (all users) and every person (admin)
    /fleet/ops:
        get:
            parameters:
                - in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FleetOp'
                                type: array
                    description: ok
            summary: Recent typed fleet operations (pending, sent, done, failed)
    /fleet/overview:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FleetOverviewRow'
                                type: array
                    description: ok
            summary: All servers with status, last seen, grade, active alerts and latest cpu/mem/disk
    /fleet/people:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Person'
                                type: array
                    description: ok
            summary: People who own SSH keys
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                email:
                                    type: string
                                groups:
                                    items:
                                        type: string
                                    type: array
                                name:
                                    type: string
                            required:
                                - name
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Person'
                    description: created
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: name taken
            summary: Add a person (admin)
    /fleet/people/{id}:
        delete:
            parameters:
                - description: id or name
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: deleted
            summary: Delete a person (admin); keys already on servers stay until revoked
    /fleet/people/{id}/groups:
        post:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                group:
                                    type: string
                                member:
                                    type: boolean
                            required:
                                - group
                            type: object
                required: true
            responses:
                "200":
                    description: ok
            summary: Add a person to or remove them from a group (admin)
    /fleet/people/{id}/keys:
        post:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                login_user:
                                    type: string
                                public_key:
                                    description: one authorized_keys line
                                    type: string
                            required:
                                - public_key
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PersonKey'
                    description: added
            summary: Assign a public key to a person (admin)
    /fleet/people/{id}/keys/{fp}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - description: SHA256:... (may contain '/')
                  in: path
                  name: fp
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: removed
            summary: Unassign a key from a person (admin); use /fleet/keys/revoke to remove it from servers
    /fleet/scans:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                tag:
                                    type: string
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FleetOp'
                                type: array
                    description: queued
            summary: Queue RunScan on every server (or servers with tag) (admin)
    /harden/checks:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/HardenCheck'
                                type: array
                    description: ok
            summary: Check catalog (built-in and YAML packs) with ignore state
    /harden/fixes:
        get:
            parameters:
                - in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Fix'
                                type: array
                    description: ok
            summary: List applied fixes
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                all:
                                    type: boolean
                                check_id:
                                    type: string
                                confirm:
                                    type: boolean
                                dry_run:
                                    type: boolean
                                severity:
                                    description: 'with all: this severity and above'
                                    enum:
                                        - critical
                                        - high
                                        - medium
                                        - low
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FixResult'
                                type: array
                    description: diffs (dry run) or applied fixes with verification
                "400":
                    description: missing confirm
                    report-only check or bad severity: null
                "404":
                    description: unknown check
            summary: Dry-run or apply fixes (harden:write). Applying requires confirm=true; firewall fixes are skipped by all=true.
    /harden/fixes/{id}/revert:
        post:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Fix'
                    description: ok
            summary: Restore a fix's backup and undo its commands (harden:write)
    /harden/ignores:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Ignore'
                                type: array
                    description: ok
            summary: Accepted risks (config.yaml harden.ignore plus API-created)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                check_id:
                                    type: string
                                reason:
                                    minLength: 1
                                    type: string
                            required:
                                - check_id
                                - reason
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ignore'
                    description: ok
            summary: Ignore a check with a mandatory reason (HD-6) (harden:write)
    /harden/ignores/{id}:
        delete:
            parameters:
                - description: check id
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
                "404":
                    description: not ignored
                "409":
                    description: defined in config.yaml
            summary: Remove an API-created ignore; config.yaml ignores answer 409 (harden:write)
    /harden/scans:
        get:
            parameters:
                - in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Scan'
                                type: array
                    description: ok
            summary: List hardening scans (newest first, without per-check results)
        post:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Scan'
                    description: ok
            summary: Run a read-only hardening scan and store it (harden:write)
    /harden/scans/{id}:
        get:
            parameters:
                - description: scan id or "latest"
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Scan'
                    description: ok
                "404":
                    description: no such scan
            summary: Fetch a scan with results
    /harden/scans/{id}/report:
        get:
            parameters:
                - description: scan id or "latest"
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: format
                  schema:
                    default: json
                    enum:
                        - json
                        - md
                        - pdf
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HardenReport'
                        application/pdf:
                            schema:
                                format: binary
                                type: string
                        text/markdown:
                            schema:
                                type: string
                    description: report file (Content-Disposition attachment)
            summary: Export a scan report (HD-4) as attachment
    /health:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    ok:
                                        type: boolean
                                    version:
                                        type: string
                                type: object
                    description: ok
            security: []
            summary: Liveness
    /metrics:
        get:
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                type: string
                    description: metrics such as serverkeeper_cpu_total_pct, serverkeeper_cpu_core_pct{core="0"}
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: no sample collected yet
            servers:
                - url: /
            summary: 'Prometheus text exposition (opt-in: collector.prometheus: true). Served at the root path /metrics, not under /api/v1; Bearer token with read scope'
    /metrics/current:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Snapshot'
                    description: ok
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: no sample collected yet or no local collector
            summary: Latest sample of all metric groups plus details (top processes, connections, services, mounts)
    /metrics/history:
        get:
            parameters:
                - description: comma-separated names or prefixes, e.g. cpu,mem,disk.used_pct; empty = all
                  in: query
                  name: names
                  schema:
                    type: string
                - description: RFC3339, unix seconds, or relative duration ago (6h, 7d); default to-1h
                  in: query
                  name: from
                  schema:
                    type: string
                - description: same formats as from; default now
                  in: query
                  name: to
                  schema:
                    type: string
                - description: Go duration bucket (10s, 1m); default ~360 points. Steps >= 1m or windows past raw retention read 1-minute rollups
                  in: query
                  name: step
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MetricHistory'
                    description: ok
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: invalid from/to/step
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: no local metrics store
            summary: Time series for metrics matching names (exact name or dotted prefix)
    /servers:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FleetServer'
                                type: array
                    description: ok
            summary: Enrolled servers (central server)
    /servers/{id}:
        delete:
            responses:
                "200":
                    description: removed
            summary: Remove a server; its client certificate is rejected from then on (admin)
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FleetServer'
                    description: ok
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: not found
            summary: One server
        parameters:
            - description: server id or name
              in: path
              name: id
              required: true
              schema:
                type: string
    /servers/{id}/metrics/history:
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - description: comma separated; cpu matches cpu and cpu.*
                  in: query
                  name: names
                  schema:
                    type: string
                - description: RFC 3339, unix seconds or a duration back (6h); default 1h ago
                  in: query
                  name: from
                  schema:
                    type: string
                - description: default now
                  in: query
                  name: to
                  schema:
                    type: string
                - description: Go duration; default range/300, min 10s
                  in: query
                  name: step
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MetricHistory'
                    description: ok
                "502":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: VictoriaMetrics unreachable
            summary: Fleet time series from VictoriaMetrics, same shape as /metrics/history
    /ssh/bans:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    backend:
                                        type: string
                                    bans:
                                        items:
                                            $ref: '#/components/schemas/Ban'
                                        type: array
                                type: object
                    description: ok
            summary: Brute-force bans and firewall backend
    /ssh/bans/{ip}:
        delete:
            parameters:
                - in: path
                  name: ip
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Unban an IP (ssh:write)
    /ssh/ca/init:
        post:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    ca_public_key:
                                        type: string
                                    path:
                                        type: string
                                type: object
                    description: ok
            summary: Create the SSH CA and trust it via safe-apply (ssh:write)
    /ssh/ca/sign:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                key_id:
                                    type: string
                                principals:
                                    items:
                                        type: string
                                    type: array
                                public_key:
                                    type: string
                                ttl:
                                    type: string
                            required:
                                - public_key
                                - principals
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    certificate:
                                        type: string
                                type: object
                    description: ok
            summary: Issue a short-lived user certificate (ssh:write)
    /ssh/changes:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/SSHChange'
                                type: array
                    description: ok
            summary: sshd change history
    /ssh/config:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SSHConfig'
                    description: ok
            summary: Managed sshd settings, current vs recommended, plus any pending change
        patch:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                dry_run:
                                    type: boolean
                                rollback:
                                    default: 120s
                                    type: string
                                set:
                                    additionalProperties:
                                        type: string
                                    type: object
                                ssh_connection:
                                    description: SSH_CONNECTION of the caller; confirm must come from another session
                                    type: string
                            required:
                                - set
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/SSHChange'
                                    - $ref: '#/components/schemas/SSHPlan'
                    description: SSHChange (apply) or SSHPlan (dry_run)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: validation failed, unsafe (SSH-4) or sshd -t error
            summary: Safe-apply settings with rollback timer; dry_run returns the plan only (ssh:write)
    /ssh/config/confirm:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                ssh_connection:
                                    type: string
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SSHChange'
                    description: ok
            summary: Confirm the pending change (ssh:write)
    /ssh/keys:
        get:
            parameters:
                - in: query
                  name: user
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/SSHKeyInfo'
                                type: array
                    description: ok
            summary: Authorized key inventory for every local user (SSH-1)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                expires_at:
                                    description: YYYY-MM-DD or RFC3339
                                    type: string
                                github:
                                    type: string
                                gitlab:
                                    type: string
                                label:
                                    type: string
                                public_key:
                                    type: string
                                user:
                                    type: string
                            required:
                                - user
                            type: object
                required: true
            responses:
                "200":
                    description: added key (or list for imports)
            summary: Add a key from text, GitHub or GitLab (ssh:write)
    /ssh/keys/{fp}:
        delete:
            parameters:
                - in: query
                  name: user
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    removed:
                                        type: integer
                                type: object
                    description: ok
            summary: Remove a key from all users or ?user= (ssh:write)
        parameters:
            - description: SHA256:... (URL-escaped)
              in: path
              name: fp
              required: true
              schema:
                type: string
        patch:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                expires_at:
                                    description: empty clears
                                    type: string
                                label:
                                    type: string
                                owner_person:
                                    type: string
                                user:
                                    type: string
                            type: object
            responses:
                "200":
                    description: ok
            summary: Update label, owner or expiry (ssh:write)
    /ssh/logins:
        get:
            parameters:
                - in: query
                  name: since
                  schema:
                    default: 24h
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginSummary'
                    description: ok
            summary: Login history with top failing IPs and users
    /ssh/sessions:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/SSHSession'
                                type: array
                    description: ok
            summary: Active sessions
    /ssh/sessions/{pid}:
        delete:
            parameters:
                - in: path
                  name: pid
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    description: ok
            summary: Kill a session (ssh:write)
    /status:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
                    description: ok
            summary: Health summary - metrics, hardening score, active alerts
    /stream:
        get:
            responses:
                "200":
                    content:
                        text/event-stream:
                            schema:
                                type: string
                    description: event stream
            summary: Server-Sent Events (metrics, alert, ssh, harden)
    /telemetry/first-dashboard:
        post:
            responses:
                "200":
                    description: ok
            summary: Record opt-in onboarding timing
    /tokens:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/APIToken'
                                type: array
                    description: ok
            summary: List API tokens (admin)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                name:
                                    type: string
                                scopes:
                                    items:
                                        enum:
                                            - read
                                            - ssh:write
                                            - harden:write
                                            - admin
                                        type: string
                                    type: array
                                ttl:
                                    type: string
                            required:
                                - name
                                - scopes
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    info:
                                        $ref: '#/components/schemas/APIToken'
                                    token:
                                        type: string
                                type: object
                    description: ok
            summary: Create scoped API token (admin); plaintext returned once
    /tokens/{id}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Revoke API token (admin)
    /users:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/User'
                                type: array
                    description: ok
            summary: List users (admin)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                password:
                                    type: string
                                role:
                                    enum:
                                        - admin
                                        - operator
                                        - viewer
                                    type: string
                                username:
                                    type: string
                            required:
                                - username
                                - password
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    totp_url:
                                        type: string
                                    user:
                                        $ref: '#/components/schemas/User'
                                type: object
                    description: ok
            summary: Create user (admin); returns TOTP enrollment URL
    /users/{id}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Delete user (admin)
    /users/{name}/unlock:
        post:
            parameters:
                - in: path
                  name: name
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Clear login lockout (admin)
security:
    - bearer: []
    - session: []
servers:
    - url: /api/v1
