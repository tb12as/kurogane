            properties:
                finished_at:
                    format: date-time
                    type: string
                grade:
                    enum:
                        - A
                        - B
                        - C
                        - D
                    type: string
                id:
                    type: string
                results:
                    items:
                        $ref: '#/components/schemas/CheckResult'
                    type: array
                score:
                    type: number
                server_id:
                    type: string
                started_at:
                    format: date-time
                    type: string
            type: object
        Series:
            properties:
                labels:
                    additionalProperties:
                        type: string
                    type: object
                metric:
                    type: string
                points:
                    description: '[unix ms, avg, max]'
                    items:
                        items:
                            type: number
                        maxItems: 3
                        minItems: 3
                        type: array
                    type: array
            type: object
        ServiceState:
            properties:
                active:
                    type: string
                sub:
                    type: string
                unit:
                    type: string
            type: object
        Silence:
            properties:
                created_by:
                    type: string
                ends_at:
                    format: date-time
                    type: string
                id:
                    type: string
                matcher:
                    properties:
                        rule:
                            type: string
                        server:
                            type: string
                        tag:
                            type: string
                    type: object
                reason:
                    type: string
                starts_at:
                    format: date-time
                    type: string
            type: object
        Site:
            properties:
                access_log:
                    type: string
                available:
                    type: string
                cert_days:
                    type: number
                certs:
                    items:
                        type: string
                    type: array
                default:
                    type: boolean
                enabled:
                    type: boolean
                file:
                    type: string
                file_sites:
                    type: integer
                id:
                    description: kind:file#index
                    type: string
                kind:
                    enum:
                        - nginx
                        - apache
                    type: string
                line:
                    type: integer
                listen:
                    items:
                        $ref: '#/components/schemas/WebListen'
                    type: array
                name:
                    description: first server name, _ for a catch-all
                    type: string
                names:
                    items:
                        type: string
                    type: array
                no_toggle:
                    type: string
                php:
                    type: boolean
                root:
                    type: string
                toggle:
                    description: absent when Kurogane will not toggle the site
                    enum:
                        - link
                        - rename
                    type: string
                upstreams:
                    items:
                        type: string
                    type: array
            required:
                - id
                - kind
                - name
                - listen
                - file
                - enabled
                - file_sites
            type: object
        SiteChange:
            properties:
                action:
                    enum:
                        - enable
                        - disable
                    type: string
                actor:
                    type: string
                error:
                    type: string
                id:
                    type: string
                kind:
                    type: string
                ops:
                    type: string
                server_id:
                    type: string
                site_id:
                    type: string
                site_name:
                    type: string
                status:
                    enum:
                        - applying
                        - applied
                        - failed
                        - rolled_back
                    type: string
                ts:
                    format: date-time
                    type: string
            type: object
        SiteInventory:
            properties:
                enabled:
                    description: false when web.enabled is off
                    type: boolean
                scanned_at:
                    format: date-time
                    type: string
                servers:
                    items:
                        $ref: '#/components/schemas/WebServer'
                    type: array
                sites:
                    items:
                        $ref: '#/components/schemas/Site'
                    type: array
            required:
                - enabled
                - servers
                - sites
            type: object
        SitePlan:
            properties:
                action:
                    enum:
                        - enable
                        - disable
                    type: string
                affected:
                    items:
                        $ref: '#/components/schemas/Site'
                    type: array
                diff:
                    type: string
                impact:
                    items:
                        type: string
                    type: array
                ops:
                    items:
                        properties:
                            from:
                                type: string
                            op:
                                type: string
                            to:
                                type: string
                        type: object
                    type: array
                site:
                    $ref: '#/components/schemas/Site'
                warnings:
                    items:
                        type: string
                    type: array
            type: object
        SiteToggle:
            properties:
                enabled:
                    description: true to enable
                    false to disable: null
                    type: boolean
                id:
                    type: string
            required:
                - id
                - enabled
            type: object
        Snapshot:
            properties:
                certs:
                    description: TLS certificates from the latest scan
                    items:
                        $ref: '#/components/schemas/Cert'
                    type: array
                conns:
                    $ref: '#/components/schemas/ConnInfo'
                lag_ns:
                    description: collection lag in nanoseconds
                    type: integer
                mounts:
                    items:
                        $ref: '#/components/schemas/Mount'
                    type: array
                redis:
                    description: monitored Redis instances
                    items:
                        $ref: '#/components/schemas/RedisInstance'
                    type: array
                samples:
                    items:
                        $ref: '#/components/schemas/Sample'
                    type: array
                services:
                    items:
                        $ref: '#/components/schemas/ServiceState'
                    type: array
                system:
                    $ref: '#/components/schemas/SystemInfo'
                top_cpu:
                    items:
                        $ref: '#/components/schemas/Proc'
                    type: array
                top_mem:
                    items:
                        $ref: '#/components/schemas/Proc'
                    type: array
                ts:
                    format: date-time
                    type: string
            type: object
        Status:
            properties:
                active_alerts:
                    items:
                        type: object
                    type: array
                hardening:
                    properties:
                        grade:
                            type: string
                        id:
                            type: string
                        scanned_at:
                            format: date-time
                            type: string
                        score:
                            type: number
                    type: object
                metrics:
                    additionalProperties:
                        type: number
                    type: object
                mounts:
                    items:
                        type: object
                    type: array
                server_name:
                    type: string
                system:
                    type: object
                time:
                    format: date-time
                    type: string
                version:
                    type: string
            type: object
        Storage:
            properties:
                agent_store:
                    properties:
                        buckets:
                            items:
                                properties:
                                    bytes:
                                        type: integer
                                    keys:
                                        type: integer
                                    name:
                                        type: string
                                type: object
                            type: array
                        file_bytes:
                            type: integer
                        raw_newest:
                            format: date-time
                            type: string
                        raw_oldest:
                            format: date-time
                            type: string
                        reclaimable_bytes:
                            type: integer
                        rollup_newest:
                            format: date-time
                            type: string
                        rollup_oldest:
                            format: date-time
                            type: string
                    type: object
                data_dir:
                    type: string
                entries:
                    items:
                        properties:
                            bytes:
                                type: integer
                            dir:
                                type: boolean
                            name:
                                type: string
                            path:
                                type: string
                        type: object
                    type: array
                total_bytes:
                    type: integer
            type: object
        SystemInfo:
            properties:
                arch:
                    type: string
                boot_time:
                    format: date-time
                    type: string
                cpus:
                    type: integer
                hostname:
                    type: string
                kernel:
                    type: string
                mem_total:
                    type: integer
                os:
                    type: string
                pending_updates:
                    type: integer
                reboot_required:
                    type: boolean
                security_updates:
                    type: integer
                started_at:
                    description: now minus uptime
                    format: date-time
                    type: string
                uptime_s:
                    type: number
            type: object
        User:
            properties:
                created_at:
                    format: date-time
                    type: string
                failed_logins:
                    type: integer
                id:
                    type: string
                locked_until:
                    format: date-time
                    type: string
                role:
                    type: string
                totp_enabled:
                    type: boolean
                username:
                    type: string
            type: object
        WebListen:
            properties:
                addr:
                    type: string
                default:
                    type: boolean
                port:
                    type: integer
                tls:
                    type: boolean
            type: object
        WebServer:
            properties:
                active:
                    type: boolean
                config_error:
                    type: string
                config_ok:
                    type: boolean
                files:
                    type: integer
                kind:
                    enum:
                        - nginx
                        - apache
                    type: string
                main:
                    type: string
                root:
                    type: string
                tested_at:
                    format: date-time
                    type: string
                unit:
                    type: string
                version:
                    type: string
            required:
                - kind
                - unit
                - active
                - config_ok
            type: object
    securitySchemes:
        bearer:
            scheme: bearer
            type: http
        session:
            in: cookie
            name: krgn_session
            type: apiKey
info:
    description: 'REST API (/api/v1). Auth: Bearer API token (scopes read, ssh:write, harden:write, admin) or session cookie + X-CSRF-Token header.'
    title: Kurogane API
    version: "1.0"
openapi: 3.1.0
paths:
    /alerts/channels:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ChannelInfo'
                                type: array
                    description: ok
            summary: List channels (secrets are never returned)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                chat_id:
                                    type: string
                                from:
                                    type: string
                                name:
                                    type: string
                                smtp_addr:
                                    type: string
                                smtp_user:
                                    type: string
                                to:
                                    items:
                                        type: string
                                    type: array
                                type:
                                    enum:
                                        - slack
                                        - discord
                                        - telegram
                                        - email
                                        - pagerduty
                                        - webhook
                                    type: string
                                webhook_url:
                                    type: string
                                webhook_url_env:
                                    type: string
                            required:
                                - name
                                - type
                            type: object
                required: true
            responses:
                "200":
                    description: ok
            summary: Add a channel; webhook_url is encrypted at rest (admin)
    /alerts/channels/{name}:
        delete:
            parameters:
                - in: path
                  name: name
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Delete an API-managed channel (admin)
    /alerts/channels/{name}/test:
        post:
            parameters:
                - in: path
                  name: name
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
                "502":
                    description: delivery failed
            summary: Send a test message (admin)
    /alerts/events:
        get:
            parameters:
                - in: query
                  name: state
                  schema:
                    enum:
                        - open
                        - firing
                        - acknowledged
                        - resolved
                    type: string
                - in: query
                  name: rule
                  schema:
                    type: string
                - in: query
                  name: server
                  schema:
                    type: string
                - description: duration, e.g. 7d
                  in: query
                  name: since
                  schema:
                    type: string
                - in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AlertEvent'
                                type: array
                    description: ok
            summary: Alert history
    /alerts/events/{id}/ack:
        post:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AlertEvent'
                    description: ok
            summary: Acknowledge (stops reminders) (admin)
    /alerts/events/{id}/noise:
        post:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                noise:
                                    type: boolean
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AlertEvent'
                    description: ok
            summary: Mark as noise / false positive (admin)
    /alerts/events/export:
        get:
            parameters:
                - in: query
                  name: format
                  schema:
                    enum:
                        - csv
                        - json
                    type: string
                - in: query
                  name: since
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AlertEvent'
                                type: array
                        text/csv:
                            schema:
                                type: string
                    description: file
            summary: Export alert history (AL-7)
    /alerts/metrics:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/MetricDef'
                                type: array
                    description: ok
            summary: Metrics a rule can use, with description, source, unit, labels, preset thresholds and current values
    /alerts/rules:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AlertRule'
                                type: array
                    description: ok
            summary: List alert rules (built-in and custom)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AlertRuleInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AlertRule'
                    description: ok
            summary: Create a rule (admin)
    /alerts/rules/{id}:
        delete:
            responses:
                "200":
                    description: ok
            summary: Delete a custom rule (built-ins can only be disabled) (admin)
        parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
        put:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AlertRuleInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AlertRule'
                    description: ok
            summary: Edit a rule; only fields given change (admin)
    /alerts/silences:
        get:
            parameters:
                - in: query
                  name: active
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Silence'
                                type: array
                    description: ok
            summary: List silences
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                ends_at:
                                    format: date-time
                                    type: string
                                for:
                                    type: string
                                reason:
                                    type: string
                                rule:
                                    type: string
                                server:
                                    type: string
                                starts_at:
                                    format: date-time
                                    type: string
                                tag:
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Silence'
                    description: ok
            summary: Create a silence / maintenance window (admin)
    /alerts/silences/{id}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Delete a silence (admin)
    /audit:
        get:
            parameters:
                - description: Go duration, e.g. 24h
                  in: query
                  name: since
                  schema:
                    type: string
                - in: query
                  name: actor
                  schema:
                    type: string
                - description: prefix match
                  in: query
                  name: action
                  schema:
                    type: string
                - in: query
                  name: limit
                  schema:
                    type: integer
                - in: query
                  name: offset
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AuditEntry'
                                type: array
                    description: ok
            summary: Audit log of every change
    /auth/login:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginResponse'
                    description: logged in
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: bad credentials
                "423":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: locked after 5 failures
            security: []
            summary: Log in with password and mandatory TOTP; sets krgn_session and krgn_csrf cookies
    /auth/logout:
        post:
            responses:
                "200":
                    description: ok
            summary: Log out
    /auth/me:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Me'
                    description: ok
            summary: Current principal
    /auth/oidc/callback:
        get:
            responses:
                "302":
                    description: redirect to /
            security: []
            summary: OIDC callback
    /auth/oidc/login:
        get:
            responses:
                "302":
                    description: redirect
            security: []
            summary: Redirect to the OIDC provider
    /backup:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                dest:
                                    description: default server.backup.dest
                                    type: string
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    manifest:
                                        $ref: '#/components/schemas/BackupManifest'
                                    path:
                                        type: string
                                type: object
                    description: written
            summary: Back up SQLite, the agent store and (central) a VictoriaMetrics snapshot (admin)
    /certs:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CertList'
                    description: ok
                "503":
                    description: no local collector (central server)
            summary: TLS certificates found on this host with expiry and served state (latest scan)
    /certs/rescan:
        post:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CertList'
                    description: ok
                "409":
                    description: certificate monitoring disabled
                "503":
                    description: no local collector (central server)
            summary: Scan certificates now (returns the last scan if one ran in the past 10 seconds)
    /fleet/enrollment-tokens:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                name:
                                    description: bind to this server name
                                    type: string
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    expires_at:
                                        format: date-time
                                        type: string
                                    name:
                                        type: string
                                    token:
                                        type: string
                                type: object
                    description: token shown once; format "<secret>.<sha256 of the central CA>"
            summary: Create a one-time agent enrollment token valid for 1 h (admin)
    /fleet/groups:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties:
                                    items:
                                        type: string
                                    type: array
                                type: object
                    description: ok
            summary: Groups and their member names
    /fleet/keys/push:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                group:
                                    type: string
                                person:
                                    type: string
                                tag:
                                    type: string
                                user:
                                    description: login user; default each key's login_user
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    ops:
                                        items:
                                            $ref: '#/components/schemas/FleetOp'
                                        type: array
                                    people:
                                        type: integer
                                    servers:
                                        type: integer
                                type: object
                    description: queued
            summary: Queue AddKey on every server (or servers with tag) for a person's or group's keys (admin)
    /fleet/keys/revoke:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                fingerprint:
                                    type: string
                            required:
                                - fingerprint
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    ops:
                                        items:
                                            $ref: '#/components/schemas/FleetOp'
                                        type: array
                                    servers:
                                        type: integer
                                type: object
                    description: queued
            summary: Remove a fingerprint from every server (all users) and every person (admin)
    /fleet/ops:
        get:
            parameters:
                - in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FleetOp'
                                type: array
                    description: ok
            summary: Recent typed fleet operations (pending, sent, done, failed)
    /fleet/overview:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FleetOverviewRow'
                                type: array
                    description: ok
            summary: All servers with status, last seen, grade, active alerts and latest cpu/mem/disk
    /fleet/people:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Person'
                                type: array
                    description: ok
            summary: People who own SSH keys
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                email:
                                    type: string
                                groups:
                                    items:
                                        type: string
                                    type: array
                                name:
                                    type: string
                            required:
                                - name
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Person'
                    description: created
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: name taken
            summary: Add a person (admin)
    /fleet/people/{id}:
        delete:
            parameters:
                - description: id or name
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: deleted
            summary: Delete a person (admin); keys already on servers stay until revoked
    /fleet/people/{id}/groups:
        post:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                group:
                                    type: string
                                member:
                                    type: boolean
                            required:
                                - group
                            type: object
                required: true
            responses:
                "200":
                    description: ok
            summary: Add a person to or remove them from a group (admin)
    /fleet/people/{id}/keys:
        post:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                login_user:
                                    type: string
                                public_key:
                                    description: one authorized_keys line
                                    type: string
                            required:
                                - public_key
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PersonKey'
                    description: added
            summary: Assign a public key to a person (admin)
    /fleet/people/{id}/keys/{fp}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - description: SHA256:... (may contain '/')
                  in: path
                  name: fp
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: removed
            summary: Unassign a key from a person (admin); use /fleet/keys/revoke to remove it from servers
    /fleet/scans:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                tag:
                                    type: string
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FleetOp'
                                type: array
                    description: queued
            summary: Queue RunScan on every server (or servers with tag) (admin)
    /fleet/sites:
        get:
            parameters:
                - in: query
                  name: q
                  schema:
                    type: string
                - in: query
                  name: server
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FleetSites'
                    description: ok
            summary: Sites reported by every agent; q matches any name or id, server narrows to one server (id or name)
    /fleet/sites/apply:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                enabled:
                                    type: boolean
                                id:
                                    type: string
                                server:
                                    type: string
                            required:
                                - server
                                - id
                                - enabled
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: queued
                "404":
                    description: unknown server or site
                "409":
                    description: not toggleable or already in that state
            summary: Queue a safe enable/disable of a site on one server (web:write); the result arrives as a fleet op
    /harden/checks:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/HardenCheck'
                                type: array
                    description: ok
            summary: Check catalog (built-in and YAML packs) with ignore state
    /harden/fixes:
        get:
            parameters:
                - in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Fix'
                                type: array
                    description: ok
            summary: List applied fixes
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                all:
                                    type: boolean
                                check_id:
                                    type: string
                                confirm:
                                    type: boolean
                                dry_run:
                                    type: boolean
                                severity:
                                    description: 'with all: this severity and above'
                                    enum:
                                        - critical
                                        - high
                                        - medium
                                        - low
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FixResult'
                                type: array
                    description: diffs (dry run) or applied fixes with verification
                "400":
                    description: missing confirm
                    report-only check or bad severity: null
                "404":
                    description: unknown check
            summary: Dry-run or apply fixes (harden:write). Applying requires confirm=true; firewall fixes are skipped by all=true.
    /harden/fixes/{id}/revert:
        post:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Fix'
                    description: ok
            summary: Restore a fix's backup and undo its commands (harden:write)
    /harden/ignores:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Ignore'
                                type: array
                    description: ok
            summary: Accepted risks (config.yaml harden.ignore plus API-created)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                check_id:
                                    type: string
                                reason:
                                    minLength: 1
                                    type: string
                            required:
                                - check_id
                                - reason
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ignore'
                    description: ok
            summary: Ignore a check with a mandatory reason (HD-6) (harden:write)
    /harden/ignores/{id}:
        delete:
            parameters:
                - description: check id
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
                "404":
                    description: not ignored
                "409":
                    description: defined in config.yaml
            summary: Remove an API-created ignore; config.yaml ignores answer 409 (harden:write)
    /harden/scans:
        get:
            parameters:
                - in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Scan'
                                type: array
                    description: ok
            summary: List hardening scans (newest first, without per-check results)
        post:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Scan'
                    description: ok
            summary: Run a read-only hardening scan and store it (harden:write)
    /harden/scans/{id}:
        get:
            parameters:
                - description: scan id or "latest"
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Scan'
                    description: ok
                "404":
                    description: no such scan
            summary: Fetch a scan with results
    /harden/scans/{id}/report:
        get:
            parameters:
                - description: scan id or "latest"
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: format
                  schema:
                    default: json
                    enum:
                        - json
                        - md
                        - pdf
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HardenReport'
                        application/pdf:
                            schema:
                                format: binary
                                type: string
                        text/markdown:
                            schema:
                                type: string
                    description: report file (Content-Disposition attachment)
            summary: Export a scan report (HD-4) as attachment
    /health:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    ok:
                                        type: boolean
                                    version:
                                        type: string
                                type: object
                    description: ok
            security: []
            summary: Liveness
    /metrics:
        get:
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                type: string
                    description: metrics such as kurogane_cpu_total_pct, kurogane_cpu_core_pct{core="0"}
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: no sample collected yet
            servers:
                - url: /
            summary: 'Prometheus text exposition (opt-in: collector.prometheus: true). Served at the root path /metrics, not under /api/v1; Bearer token with read scope'
    /metrics/current:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Snapshot'
                    description: ok
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: no sample collected yet or no local collector
            summary: Latest sample of all metric groups plus details (top processes, connections, services, mounts)
    /metrics/history:
        get:
            parameters:
                - description: comma-separated names or prefixes, e.g. cpu,mem,disk.used_pct; empty = all
                  in: query
                  name: names
                  schema:
                    type: string
                - description: RFC3339, unix seconds, or relative duration ago (6h, 7d); default to-1h
                  in: query
                  name: from
                  schema:
                    type: string
                - description: same formats as from; default now
                  in: query
                  name: to
                  schema:
                    type: string
                - description: Go duration bucket (10s, 1m); default ~360 points. Steps >= 1m or windows past raw retention read 1-minute rollups
                  in: query
                  name: step
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MetricHistory'
                    description: ok
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: invalid from/to/step
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: no local metrics store
            summary: Time series for metrics matching names (exact name or dotted prefix)
    /servers:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FleetServer'
                                type: array
                    description: ok
            summary: Enrolled servers (central server)
    /servers/{id}:
        delete:
            responses:
                "200":
                    description: removed
            summary: Remove a server; its client certificate is rejected from then on (admin)
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FleetServer'
                    description: ok
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: not found
            summary: One server
        parameters:
            - description: server id or name
              in: path
              name: id
              required: true
              schema:
                type: string
    /servers/{id}/metrics/history:
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - description: comma separated; cpu matches cpu and cpu.*
                  in: query
                  name: names
                  schema:
                    type: string
                - description: RFC 3339, unix seconds or a duration back (6h); default 1h ago
                  in: query
                  name: from
                  schema:
                    type: string
                - description: default now
                  in: query
                  name: to
                  schema:
                    type: string
                - description: Go duration; default range/300, min 10s
                  in: query
                  name: step
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MetricHistory'
                    description: ok
                "502":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: VictoriaMetrics unreachable
            summary: Fleet time series from VictoriaMetrics, same shape as /metrics/history
    /sites:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SiteInventory'
                    description: ok
            summary: nginx and Apache sites on this host (enabled and disabled) with the web servers' config test state
    /sites/apply:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SiteToggle'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SiteChange'
                    description: applied
                "404":
                    description: unknown site id
                "409":
                    description: refused
                    or another change is in progress: null
                "422":
                    description: failed or rolled back; the message says why and the change is in /sites/changes
            summary: Enable or disable a site (web:write). Config test before and after, reload, probe; undone on any failure.
    /sites/changes:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/SiteChange'
                                type: array
                    description: ok
            summary: Site enable/disable history, newest first
    /sites/config:
        get:
            parameters:
                - in: query
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    content:
                                        type: string
                                    file:
                                        type: string
                                type: object
                    description: ok
                "404":
                    description: unknown site id
            summary: The file that defines a site and its content (web:write; config may hold secrets)
    /sites/plan:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SiteToggle'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SitePlan'
                    description: ok
                "404":
                    description: unknown site id
                "409":
                    description: refused (already in that state
                    not toggleable): null
            summary: Dry run of enabling or disabling a site; nothing changes
    /sites/rescan:
        post:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SiteInventory'
                    description: ok
            summary: Re-read the configuration and run the config tests now (web:write)
    /ssh/bans:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    backend:
                                        type: string
                                    bans:
                                        items:
                                            $ref: '#/components/schemas/Ban'
                                        type: array
                                type: object
                    description: ok
            summary: Brute-force bans and firewall backend
    /ssh/bans/{ip}:
        delete:
            parameters:
                - in: path
                  name: ip
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Unban an IP (ssh:write)
    /ssh/ca/init:
        post:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    ca_public_key:
                                        type: string
                                    path:
                                        type: string
                                type: object
                    description: ok
            summary: Create the SSH CA and trust it via safe-apply (ssh:write)
    /ssh/ca/sign:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                key_id:
                                    type: string
                                principals:
                                    items:
                                        type: string
                                    type: array
                                public_key:
                                    type: string
                                ttl:
                                    type: string
                            required:
                                - public_key
                                - principals
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    certificate:
                                        type: string
                                type: object
                    description: ok
            summary: Issue a short-lived user certificate (ssh:write)
    /ssh/changes:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/SSHChange'
                                type: array
                    description: ok
            summary: sshd change history
    /ssh/config:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SSHConfig'
                    description: ok
            summary: Managed sshd settings, current vs recommended, plus any pending change
        patch:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                dry_run:
                                    type: boolean
                                rollback:
                                    default: 120s
                                    type: string
                                set:
                                    additionalProperties:
                                        type: string
                                    type: object
                                ssh_connection:
                                    description: SSH_CONNECTION of the caller; confirm must come from another session
                                    type: string
                            required:
                                - set
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/SSHChange'
                                    - $ref: '#/components/schemas/SSHPlan'
                    description: SSHChange (apply) or SSHPlan (dry_run)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: validation failed, unsafe (SSH-4) or sshd -t error
            summary: Safe-apply settings with rollback timer; dry_run returns the plan only (ssh:write)
    /ssh/config/confirm:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                ssh_connection:
                                    type: string
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SSHChange'
                    description: ok
            summary: Confirm the pending change (ssh:write)
    /ssh/keys:
        get:
            parameters:
                - in: query
                  name: user
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/SSHKeyInfo'
                                type: array
                    description: ok
            summary: Authorized key inventory for every local user (SSH-1)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                expires_at:
                                    description: YYYY-MM-DD or RFC3339
                                    type: string
                                github:
                                    type: string
                                gitlab:
                                    type: string
                                label:
                                    type: string
                                public_key:
                                    type: string
                                user:
                                    type: string
                            required:
                                - user
                            type: object
                required: true
            responses:
                "200":
                    description: added key (or list for imports)
            summary: Add a key from text, GitHub or GitLab (ssh:write)
    /ssh/keys/{fp}:
        delete:
            parameters:
                - in: query
                  name: user
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    removed:
                                        type: integer
                                type: object
                    description: ok
            summary: Remove a key from all users or ?user= (ssh:write)
        parameters:
            - description: SHA256:... (URL-escaped)
              in: path
              name: fp
              required: true
              schema:
                type: string
        patch:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                expires_at:
                                    description: empty clears
                                    type: string
                                label:
                                    type: string
                                owner_person:
                                    type: string
                                user:
                                    type: string
                            type: object
            responses:
                "200":
                    description: ok
            summary: Update label, owner or expiry (ssh:write)
    /ssh/logins:
        get:
            parameters:
                - in: query
                  name: since
                  schema:
                    default: 24h
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginSummary'
                    description: ok
            summary: Login history with top failing IPs and users
    /ssh/sessions:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/SSHSession'
                                type: array
                    description: ok
            summary: Active sessions
    /ssh/sessions/{pid}:
        delete:
            parameters:
                - in: path
                  name: pid
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    description: ok
            summary: Kill a session (ssh:write)
    /status:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
                    description: ok
            summary: Health summary - metrics, hardening score, active alerts
    /storage:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Storage'
                    description: ok
            summary: Disk usage of data_dir (and VictoriaMetrics on central) plus agent store details
    /storage/history/clear:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                older_than:
                                    description: duration like 6h or 7d; 0 deletes all history
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    file_bytes:
                                        type: integer
                                    freed_bytes:
                                        type: integer
                                type: object
                    description: cleared
                "503":
                    description: no local metrics store (central server)
            summary: Delete metric history older than a cutoff and compact the agent store (admin)
    /stream:
        get:
            responses:
                "200":
                    content:
                        text/event-stream:
                            schema:
                                type: string
                    description: event stream
            summary: Server-Sent Events (metrics, alert, ssh, harden)
    /telemetry/first-dashboard:
        post:
            responses:
                "200":
                    description: ok
            summary: Record opt-in onboarding timing
    /tokens:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/APIToken'
                                type: array
                    description: ok
            summary: List API tokens (admin)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                name:
                                    type: string
                                scopes:
                                    items:
                                        enum:
                                            - read
                                            - ssh:write
                                            - harden:write
                                            - web:write
                                            - admin
                                        type: string
                                    type: array
                                ttl:
                                    type: string
                            required:
                                - name
                                - scopes
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    info:
                                        $ref: '#/components/schemas/APIToken'
                                    token:
                                        type: string
                                type: object
                    description: ok
            summary: Create scoped API token (admin); plaintext returned once
    /tokens/{id}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Revoke API token (admin)
    /uninstall:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                confirm:
                                    description: the server name
                                    type: string
                                purge:
                                    type: boolean
                            required:
                                - confirm
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    purge:
                                        type: boolean
                                    started:
                                        type: boolean
                                type: object
                    description: started
            summary: Uninstall the agent from this host in 3 seconds; purge also deletes data, config and user (admin)
    /users:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/User'
                                type: array
                    description: ok
            summary: List users (admin)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                password:
                                    type: string
                                role:
                                    enum:
                                        - admin
                                        - operator
                                        - viewer
                                    type: string
                                username:
                                    type: string
                            required:
                                - username
                                - password
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    totp_url:
                                        type: string
                                    user:
                                        $ref: '#/components/schemas/User'
                                type: object
                    description: ok
            summary: Create user (admin); returns TOTP enrollment URL
    /users/{id}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Delete user (admin)
    /users/{name}/unlock:
        post:
            parameters:
                - in: path
                  name: name
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Clear login lockout (admin)
    /web/{server}/reload:
        post:
            parameters:
                - in: path
                  name: server
                  required: true
                  schema:
                    enum:
                        - nginx
                        - apache
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    reloaded:
                                        type: boolean
                                type: object
                    description: reloaded
                "409":
                    description: config test fails
            summary: Config test, then systemctl reload of nginx or apache (web:write); refused while the test fails
security:
    - bearer: []
    - session: []
servers:
    - url: /api/v1
