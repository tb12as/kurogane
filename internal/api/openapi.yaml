info:
    description: 'REST API (/api/v1). Auth: Bearer API token (scopes read, ssh:write, harden:write, admin) or session cookie + X-CSRF-Token header.'
    title: ServerKeeper API
    version: "1.0"
openapi: 3.1.0
paths:
    /alerts/channels:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ChannelInfo'
                                type: array
                    description: ok
            summary: List channels (secrets are never returned)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                chat_id:
                                    type: string
                                from:
                                    type: string
                                name:
                                    type: string
                                smtp_addr:
                                    type: string
                                smtp_user:
                                    type: string
                                to:
                                    items:
                                        type: string
                                    type: array
                                type:
                                    enum:
                                        - slack
                                        - discord
                                        - telegram
                                        - email
                                        - pagerduty
                                        - webhook
                                    type: string
                                webhook_url:
                                    type: string
                                webhook_url_env:
                                    type: string
                            required:
                                - name
                                - type
                            type: object
                required: true
            responses:
                "200":
                    description: ok
            summary: Add a channel; webhook_url is encrypted at rest (admin)
    /alerts/channels/{name}:
        delete:
            parameters:
                - in: path
                  name: name
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
            summary: Delete an API-managed channel (admin)
    /alerts/channels/{name}/test:
        post:
            parameters:
                - in: path
                  name: name
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: ok
                "502":
                    description: delivery failed
            summary: Send a test message (admin)
    /alerts/events:
        get:
            parameters:
                - in: query
                  name: state
                  schema:
                    enum:
                        - open
                        - firing
                        - acknowledged
                        - resolved
                    type: string
                - in: query
                  name: rule
                  schema:
                    type: string
                - in: query
                  name: server
                  schema:
                    type: string
                - description: duration, e.g. 7d
                  in: query
                  name: since
                  schema:
                    type: string
                - in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AlertEvent'
                                type: array
                    description: ok
            summary: Alert history
    /alerts/events/{id}/ack:
        post:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AlertEvent'
                    description: ok
            summary: Acknowledge (stops reminders) (admin)
    /alerts/events/{id}/noise:
        post:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                noise:
                                    type: boolean
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AlertEvent'
                    description: ok
            summary: Mark as noise / false positive (admin)
    /alerts/events/export:
        get:
            parameters:
                - in: query
                  name: format
                  schema:
                    enum:
                        - csv
                        - json
                    type: string
                - in: query
                  name: since
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AlertEvent'
                                type: array
                        text/csv:
                            schema:
                                type: string
                    description: file
            summary: Export alert history (AL-7)
    /alerts/rules:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AlertRule'
                                type: array
                    description: ok
            summary: List alert rules (built-in and custom)
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AlertRuleInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AlertRule'
                    description: ok
            summary: Create a rule (admin)
    /alerts/rules/{id}:
        delete:
            responses:
                "200":
                    description: ok
            summary: Delete a custom rule (built-ins can only be disabled) (admin)
        parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
        put:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AlertRuleInput'
                required: true
            responses:
